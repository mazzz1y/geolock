name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Set manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting manifest.json version to ${VERSION}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Locate changelog
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG="metadata/en-US/changelogs/${VERSION}.txt"
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::Changelog not found: $CHANGELOG"
            exit 1
          fi
          echo "path=$CHANGELOG" >> $GITHUB_OUTPUT

      - run: npm test

      - run: npm run build

      - name: Inject release notes into amo-metadata
        run: |
          NOTES=$(cat "${{ steps.changelog.outputs.path }}")
          jq --arg notes "$NOTES" \
             '.version.release_notes = { "en-US": $notes }' \
             metadata/amo-metadata.json > metadata/amo-metadata.json.tmp
          mv metadata/amo-metadata.json.tmp metadata/amo-metadata.json

      - name: Submit to AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign \
            --channel=listed \
            --source-dir=. \
            --amo-metadata=metadata/amo-metadata.json \
            --approval-timeout=0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${{ steps.changelog.outputs.path }}" \
            web-ext-artifacts/*.zip
